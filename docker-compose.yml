version: '3.8'

services:
  db:
    build:
      context: ./docker
      dockerfile: Dockerfile
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: insurance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./json-files:/json-files
    networks:
      - insurance_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "insurance_db"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  supabase:
    image: supabase/studio:latest
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: postgres
      DEFAULT_ORGANIZATION: Insurance Database
      DEFAULT_PROJECT: Insurance DB Local
    networks:
      - insurance_network

  meta:
    image: supabase/postgres-meta:latest
    depends_on:
      - db
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PASSWORD: postgres
    ports:
      - "8080:8080"
    networks:
      - insurance_network

volumes:
  postgres_data:

networks:
  insurance_network:
    driver: bridge 